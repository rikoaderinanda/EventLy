<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EventLy - Platform Undangan Digital, RSVP &amp; QR Check-in Acara</title>
    <meta
      name="description"
      content="Buat undangan digital, kelola RSVP, check-in QR tamu, dan galeri foto acara dalam satu platform EventLy."
    />
    <!-- Open Graph / Twitter. Replace og-image.png (source: docs/design/og-image.html); when the domain is
         known, make og:image an absolute URL and add og:url and a canonical link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EventLy" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="EventLy - Platform Undangan Digital, RSVP &amp; QR Check-in Acara" />
    <meta
      property="og:description"
      content="Buat undangan digital, kelola RSVP, check-in QR tamu, dan galeri foto acara dalam satu platform EventLy."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EventLy: undangan digital, RSVP, check-in QR dan galeri foto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EventLy - Platform Undangan Digital, RSVP &amp; QR Check-in Acara" />
    <meta
      name="twitter:description"
      content="Buat undangan digital, kelola RSVP, check-in QR tamu, dan galeri foto acara dalam satu platform EventLy."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Schema.org: the product and its packages (same values as features/landing/packages.ts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "EventLy",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS (PWA)",
        "inLanguage": ["id", "en"],
        "description": "Platform acara digital untuk Indonesia: undangan digital, RSVP, check-in QR, dan galeri foto tamu.",
        "offers": [
          { "@type": "Offer", "name": "Basic", "price": "150000", "priceCurrency": "IDR" },
          { "@type": "Offer", "name": "Premium", "price": "350000", "priceCurrency": "IDR" },
          { "@type": "Offer", "name": "Enterprise", "price": "1000000", "priceCurrency": "IDR" }
        ]
      }
    </script>
    <style>
      /* Splash: shown inside #root until React renders the first page (React replaces it). */
      html,
      body {
        background: #faf7f2;
        margin: 0;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, sans-serif;
        color: #6f4032;
      }
      .splash img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 10px 30px -10px rgb(155 90 67 / 0.6);
        animation: splash-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash span {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: splash-in 600ms 150ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash img,
        .splash span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <img src="/icon.svg" alt="" />
        <span>EventLy</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
