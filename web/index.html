<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Undangan digital, RSVP, check-in QR, dan galeri foto acara." />
    <title>EventLy</title>
    <style>
      /* Splash: shown inside #root until React renders the first page (React replaces it). */
      html,
      body {
        background: #faf7f2;
        margin: 0;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, sans-serif;
        color: #6f4032;
      }
      .splash img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 10px 30px -10px rgb(155 90 67 / 0.6);
        animation: splash-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash span {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: splash-in 600ms 150ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash img,
        .splash span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <img src="/icon.svg" alt="" />
        <span>EventLy</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
