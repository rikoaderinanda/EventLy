# Local development stack: `docker compose up --build`, then open http://localhost:8080
# Values come from .env (copy .env.example). Defaults below are for local use only.
name: evently

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evently}
      POSTGRES_USER: ${POSTGRES_USER:-evently}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evently_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kept locally so the Redis code path stays tested (spec). Production stage 1 uses the in-memory cache.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for photos and invitation media (production: Cloudflare R2).
  # SeaweedFS (Apache-2.0): MinIO no longer publishes free images. Local-only credentials below.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-evently}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-evently-dev-only}
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies EF Core migrations once, then exits. The app starts only after it succeeds.
  migrate:
    build: .
    image: evently:local
    command: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-evently};Username=${POSTGRES_USER:-evently};Password=${POSTGRES_PASSWORD:-evently_dev}
      # The migrate command also creates the storage bucket.
      Storage__ServiceUrl: http://storage:8333
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-evently}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:-evently-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  app:
    image: evently:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-evently};Username=${POSTGRES_USER:-evently};Password=${POSTGRES_PASSWORD:-evently_dev}
      Cache__Provider: Redis
      Cache__RedisConnection: redis:6379
      ApiDocs__Enabled: "true"
      # Optional: real Google sign-in (docs/setup-guide.md §7). Without it, use the test sign-in.
      Auth__GoogleClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__RootEmail: ${AUTH_ROOT_EMAIL:-root@evently.test}
      # Origin in invitation links and QR codes. Empty = the browser's origin (fine on this PC only).
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-}
      Storage__ServiceUrl: http://storage:8333
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-evently}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:-evently-dev-only}
      # Signed photo URLs point here; the browser must be able to reach it (a tunnel URL for phones).
      Storage__PublicUrl: ${STORAGE_PUBLIC_URL:-http://127.0.0.1:8333}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storagedata:
