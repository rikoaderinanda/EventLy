<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(900px 500px at 15% 0%, #f3e3cc 0%, transparent 60%),
          radial-gradient(700px 500px at 100% 100%, #f6eccb 0%, transparent 55%), #faf7f2;
        color: #3d231b;
        display: flex; align-items: center;
      }
      .left { padding: 0 0 0 80px; width: 640px; }
      .brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 34px; }
      .mark { width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(180deg, #b06c52, #87503c); display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 30px -10px rgba(155, 90, 67, .6); }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 58px; line-height: 1.08; margin: 36px 0 22px; font-weight: 600; }
      h1 span { color: #9b5a43; }
      p { font-size: 26px; line-height: 1.45; color: #5c4f48; margin: 0; }
      .chips { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
      .chip { background: #fff; border: 1px solid #eddcc8; border-radius: 999px; padding: 10px 18px; font-size: 20px; font-weight: 600; color: #6f4032; }
      .card { margin-left: 40px; width: 380px; height: 480px; border-radius: 40px; background: linear-gradient(180deg, #faf7f2, #fff);
        border: 1px solid #eddcc8; box-shadow: 0 40px 80px -30px rgba(61, 35, 27, .45); transform: rotate(-3deg);
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .eyebrow { font-size: 14px; letter-spacing: .35em; text-transform: uppercase; color: #78716c; }
      .names { font-family: Georgia, serif; font-size: 64px; margin: 18px 0 10px; }
      .date { font-size: 20px; color: #6f625a; }
      .line { width: 160px; height: 2px; background: #c9a227; margin: 26px 0; opacity: .7; }
      .btn { background: linear-gradient(180deg, #b06c52, #87503c); color: #fff; border-radius: 999px; padding: 14px 28px; font-weight: 700; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <div class="mark">
          <svg width="40" height="40" viewBox="0 0 512 512"><path d="M160 176h192M160 256h140M160 336h192M160 176v160" stroke="#faf7f2" stroke-width="40" stroke-linecap="round" fill="none"/><circle cx="360" cy="256" r="22" fill="#e8c9a5"/></svg>
        </div>
        EventLy
      </div>
      <h1>Buat acara lebih berkesan, <span>dari undangan hingga kenangan.</span></h1>
      <p>Undangan digital, RSVP, check-in QR dan galeri foto dalam satu platform.</p>
      <div class="chips"><span class="chip">Undangan Digital</span><span class="chip">RSVP</span><span class="chip">QR Check-in</span><span class="chip">Galeri Foto</span></div>
    </div>
    <div class="card">
      <div class="eyebrow">Undangan Pernikahan</div>
      <div class="names">Rina &amp; Budi</div>
      <div class="date">Minggu, 20 Desember 2026</div>
      <div class="line"></div>
      <div class="btn">Buka Undangan</div>
    </div>
  </body>
</html>
